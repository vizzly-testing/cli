version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Routine updates run weekly; security updates run independently.
      interval: "weekly"
      day: "monday"
      time: "09:17"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "⬆️"
    # Ember's build plugins still require Babel 7. Review Babel majors together
    # when that toolchain supports them; keep minor, patch, and security updates.
    ignore:
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/plugin-transform-runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/runtime"
        update-types: ["version-update:semver-major"]
      # ember-data 5.9.1 requires QUnit 2.
      - dependency-name: "qunit"
        update-types: ["version-update:semver-major"]
    groups:
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
    # One routine PR per group; security PRs have a separate GitHub limit.
    open-pull-requests-limit: 2
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
