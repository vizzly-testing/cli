version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Required by Dependabot; security updates run independently.
      interval: "weekly"
      day: "monday"
      time: "09:17"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "⬆️"
    groups:
      security-dependencies:
        applies-to: security-updates
        patterns:
          - "*"
    # Disable routine version PRs; security PRs have a separate GitHub limit.
    open-pull-requests-limit: 0
