name: Daily dependency audit

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit workspace dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Use Node.js 22.23.4
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.23.4'

      - name: Install pnpm
        run: |
          npm install -g corepack@latest
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      # Dependabot owns fix PRs; this workflow keeps unresolved findings visible.
      - name: Audit all workspace dependencies
        run: pnpm audit
