name: Release Swift Client

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for Trusted Publishers
        run: npm install -g npm@11.5.1

      - name: Configure git
        run: |
          git config --local user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --local user.name "${{ secrets.GIT_USER_NAME }}"

      - name: Ensure we have latest main
        run: |
          git fetch origin main --tags
          git reset --hard origin/main

      - name: Prepare release version
        id: new_version
        working-directory: ./clients/swift
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PREVIOUS_TAG=""
          if git rev-parse "swift/v$CURRENT_VERSION" >/dev/null 2>&1; then
            PREVIOUS_TAG="swift/v$CURRENT_VERSION"
          fi
          NEW_VERSION=$(npm version "$VERSION_TYPE" --no-git-tag-version | sed 's/^v//')

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=swift/v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "spm_tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release tags are available
        run: |
          for tag in \
            "${{ steps.new_version.outputs.tag }}" \
            "${{ steps.new_version.outputs.spm_tag }}"
          do
            if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Release tag $tag already exists"
              exit 1
            fi
          done

      - name: Generate changelog
        continue-on-error: true
        uses: openai/codex-action@a26d2d4d8b78a694338b8e3715c3630254340b2c # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-luna
          sandbox: workspace-write
          safety-strategy: drop-sudo
          prompt: |
            Generate release notes for the Vizzly Swift SDK v${{ steps.new_version.outputs.version }}.

            Context:
            - Client location: `clients/swift/`
            - Previous tag: `${{ steps.new_version.outputs.previous_tag }}`
            - New version: `${{ steps.new_version.outputs.version }}`
            - This is a monorepo with multiple clients and a CLI.
            - Compare URL when a previous tag exists: `https://github.com/vizzly-testing/cli/compare/${{ steps.new_version.outputs.previous_tag }}...swift/v${{ steps.new_version.outputs.version }}`
            - Release URL when this is the first Swift tag: `https://github.com/vizzly-testing/cli/releases/tag/swift/v${{ steps.new_version.outputs.version }}`

            Instructions:
            1. Use git commands to inspect commits and changed files since the previous Swift tag. If no previous tag is listed, inspect the Swift client history and current files.
            2. Analyze which changes are relevant to `clients/swift/`.
            3. Read relevant code changes when commit messages are not enough.
            4. Generate user-friendly release notes with categories: Added, Changed, Fixed.
            5. Focus on user-facing changes only.
            6. If there are no relevant changes, output: "No changes to Swift client in this release".
            7. Save the changelog to `clients/swift/CHANGELOG-RELEASE.md`.

            Use this format:

            ## What's Changed

            ### Added
            - New features

            ### Changed
            - Breaking or notable changes

            ### Fixed
            - Bug fixes

            **Full Changelog**: <use the compare URL when a previous tag exists, otherwise use the release URL>

      - name: Update CHANGELOG.md
        working-directory: ./clients/swift
        run: |
          # Check if changelog was generated successfully
          if [ ! -f CHANGELOG-RELEASE.md ]; then
            echo "Warning: CHANGELOG-RELEASE.md not found, creating fallback changelog"
            cat > CHANGELOG-RELEASE.md << 'EOF'
          ## What's Changed

          Release v${{ steps.new_version.outputs.version }}

          See the full diff for detailed changes.
          EOF
          fi

          # Prepend new release to CHANGELOG.md
          echo -e "# Vizzly Swift SDK Changelog\n" > CHANGELOG-NEW.md
          echo "## [${{ steps.new_version.outputs.version }}] - $(date +%Y-%m-%d)" >> CHANGELOG-NEW.md
          echo "" >> CHANGELOG-NEW.md
          cat CHANGELOG-RELEASE.md >> CHANGELOG-NEW.md
          echo "" >> CHANGELOG-NEW.md
          tail -n +2 CHANGELOG.md >> CHANGELOG-NEW.md
          mv CHANGELOG-NEW.md CHANGELOG.md
          rm CHANGELOG-RELEASE.md

      - name: Restore Node.js for publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Restore npm for publishing
        run: npm install -g npm@11.5.1

      - name: Verify Trusted Publishing runtime
        run: |
          node --version
          npm --version

      - name: Verify npm package version is unpublished
        working-directory: ./clients/swift
        env:
          RELEASE_VERSION: ${{ steps.new_version.outputs.version }}
        run: |
          if NPM_OUTPUT=$(npm view "@vizzly-testing/swift@$RELEASE_VERSION" version 2>&1); then
            echo "@vizzly-testing/swift@$RELEASE_VERSION is already published"
            exit 1
          elif printf '%s\n' "$NPM_OUTPUT" | grep -q 'E404'; then
            :
          else
            printf '%s\n' "$NPM_OUTPUT"
            exit 1
          fi

      - name: Pack npm package
        id: pack
        working-directory: ./clients/swift
        run: |
          PACK_FILE=$(npm pack --ignore-scripts)
          echo "file=$PACK_FILE" >> $GITHUB_OUTPUT

      - name: Configure git identity
        run: |
          git config --local user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --local user.name "${{ secrets.GIT_USER_NAME }}"

      - name: Publish preview CLI package to npm
        working-directory: ./clients/swift
        run: npm publish "${{ steps.pack.outputs.file }}" --provenance --access public --ignore-scripts

      - name: Commit and push changes
        run: |
          git add clients/swift/package.json clients/swift/CHANGELOG.md
          git commit -m "🔖 Swift client v${{ steps.new_version.outputs.version }}"
          git tag "${{ steps.new_version.outputs.tag }}"
          git tag "${{ steps.new_version.outputs.spm_tag }}"
          git push --atomic origin \
            main \
            "${{ steps.new_version.outputs.tag }}" \
            "${{ steps.new_version.outputs.spm_tag }}"

      - name: Read changelog for release
        id: release_notes
        working-directory: ./clients/swift
        run: |
          # Extract just this version's changelog
          CHANGELOG=$(sed -n '/## \[${{ steps.new_version.outputs.version }}\]/,/## \[/p' CHANGELOG.md | sed '$ d')
          {
            echo 'notes<<CHANGELOG_EOF'
            echo "$CHANGELOG"
            echo 'CHANGELOG_EOF'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.new_version.outputs.tag }}
          name: 📱 Swift SDK v${{ steps.new_version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          files: ./clients/swift/${{ steps.pack.outputs.file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
