packages:
  - clients/*
  - clients/ember/test-app
  - clients/storybook/example-storybook
  - examples/custom-plugin
  - test-site

overrides:
  '@babel/runtime@<7.26.10': 7.29.7
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  socket.io-parser@>=4.0.0 <4.2.7: 4.2.7
  tmp@<0.2.6: 0.2.7
  ws@<8.21.0: 8.21.3

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - '@vizzly-testing/bear-den@0.1.2'
  - '@vizzly-testing/honeydiff@0.11.1'
onlyBuiltDependencies:
  - canvas
  - esbuild
  - node-pty
  - odiff-bin
allowBuilds:
  canvas: true
  esbuild: true
  node-pty: true
  odiff-bin: true
