packages:
  - clients/*
  - clients/ember/test-app
  - clients/storybook/example-storybook
  - examples/custom-plugin
  - test-site

overrides:
  # can-symlink and external-editor require vulnerable tmp 0.0.x releases.
  tmp@<0.2.6: 0.2.7
  # express and tiny-lr pin qs 6.16.0, which is vulnerable to GHSA-6pq8-jhm2-2vcw.
  qs@>=6.7.0 <6.16.1: 6.16.1
  # Keep transitive dependencies on patched releases until their parents update.
  markdown-it@>=14.1.0 <14.3.3: 14.3.3
  zod@>=4.0.0 <4.6.6: 4.6.7
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  fast-uri@>=3.0.0 <3.1.9: 3.1.9
  # Stop affected glob walks when their AbortSignal is cancelled.
  glob@>=9.0.0 <14.0.2: 14.0.2
  # Fix credential forwarding in http-proxy's redirect dependency.
  follow-redirects@>=1.16.0 <1.16.2: 1.16.2

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Allow these exact security fixes and required dependencies without waiting.
minimumReleaseAgeExclude:
  - '@isaacs/nonrecursive-glob-match@1.0.3'
  - body-parser@2.4.0
  - fast-uri@3.1.9
  # Parser CPU-exhaustion fix (GHSA-474x-hrwr-fgx4) and its required dependency.
  - fast-xml-parser@5.12.0
  - is-unsafe@2.0.3
  - glob@14.0.2
  - minimatch@11.0.4
  - path-scurry@3.0.0
onlyBuiltDependencies:
  - canvas
  - esbuild
  - node-pty
  - odiff-bin
allowBuilds:
  canvas: true
  esbuild: true
  node-pty: true
  odiff-bin: true
